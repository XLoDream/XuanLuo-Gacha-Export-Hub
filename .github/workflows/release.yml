name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve version tag
        id: meta
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 先打包，不交给 electron-builder 上传：它的 GitHub 发布任务并发时会撞 422
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Build mini launcher
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /out:dist\XuanLuo-Gacha-Export-Hub-MiniSetup.exe /win32icon:icon\app.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll launcher\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\XuanLuo-Gacha-Export-Hub-MiniSetup.exe | Select-Object Name, @{N='SizeKB';E={[math]::Round($_.Length/1KB,1)}}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          make_latest: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
